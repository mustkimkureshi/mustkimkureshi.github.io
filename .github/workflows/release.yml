name: Pages Deploy
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.pages-deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Patch
        env:
          A1CB05: ${{ secrets.A1CB05 }}
          B0CCF7: ${{ secrets.B0CCF7 }}
        run: |
          python3 -c "
          import pathlib, sys, os
          env_a = os.environ.get('A1CB05', '')
          env_b = os.environ.get('B0CCF7', '')
          doc = pathlib.Path('index.html')
          body = doc.read_text(encoding='utf-8')
          result = body
          if env_a:
              result = result.replace('<!-- 3461817e430880bc94839cfcf9203f9a87656127a345 -->', env_a)
          if env_b:
              result = result.replace('<!-- cae0235fb97c49d88032ba5b841e3968646f -->', env_b)
          if result == body and (env_a or env_b):
              sys.exit(1)
          if result != body:
              doc.write_text(result, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: pages-deploy
        uses: actions/deploy-pages@v4
